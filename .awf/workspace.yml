awf:
  name: awf-self
  version: 1
  description: AWF self-dogfood profile for Python CLI/control-plane work.
  docker:
    mode: none
  runtime:
    environment:
      PYTHONUNBUFFERED: "1"
  security:
    egress:
      mode: open
      open_explanation: AWF self-dogfood needs unrestricted internet to bootstrap services, run the local API/worker Postgres stack, pull agent and control-plane images, and support broad engineering dogfood experiments.
  planning:
    required: true
    plan_path: docs/awf-plans/{workspace_id}.md
    conformance_report_path: docs/awf-plans/{workspace_id}.conformance.json
    max_iterations: 3
    enforce_plan_only_changes: true
    fail_on_unexplained_deviation: true
  monitor:
    non_check_reviewer_settle_seconds: 900
    non_check_reviewer_logins:
      - greptile-apps
      - chatgpt-codex-connector
  validation:
    requested_tier: 1
    strategy:
      baseline_coverage: skip
      edit_gate: targeted
      final_gate: coverage
      reuse_evidence: true
      freshness_max_age_seconds: 86400
      full_gate_concurrency: 1
    coverage:
      minimum_percent: 99
      enforce: true
      provider: python
      parallel_workers: 3
      command:
        command: uv run --python 3.12 --extra dev pytest --cov=awf --cov-report=term-missing
        timeout_seconds: 7200
  phases:
    setup:
      - command: uv sync --extra dev
        timeout_seconds: 900
    validate:
      - command: uv run ruff check src/awf/cli tests/unit/cli
        timeout_seconds: 300
      - command: uv run mypy src/awf/cli
        timeout_seconds: 300
      - command: uv run pytest tests/unit/cli -q
        timeout_seconds: 300
      - command: uv run --python 3.12 --extra dev pytest tests/unit/control/test_test_quality_guardrails_self.py -q
        timeout_seconds: 300
