# AWF Core Cloud Build — publish rc-$COMMIT_SHA images and an immutable
# provenance carrier recorded in Build results.images.
#
# Product outputs (Buildx --push, NOT listed under top-level images:):
#   ${_ARTIFACT_REPOSITORY}/awf-core:rc-$COMMIT_SHA
#   ${_ARTIFACT_REPOSITORY}/awf-agent-runtime:rc-$COMMIT_SHA  (linux/amd64+arm64)
#   ${_ARTIFACT_REPOSITORY}/awf-core-console:rc-$COMMIT_SHA   (hosted paths)
#
# Provenance carrier (only entry in images: so Cloud Build records its digest):
#   ${_ARTIFACT_REPOSITORY}/awf-core-provenance:build-$BUILD_ID
#
# Carrier image config labels (validated before build; digests from Buildx
# --metadata-file of each push — never from a later mutable-tag lookup):
#   awf.build.id              = $BUILD_ID
#   awf.git.commit            = lowercase 40-char hex $COMMIT_SHA
#   awf.source.repository     = $REPO_FULL_NAME
#   awf.core.digest           = sha256:… from awf-core.metadata.json
#   awf.agent.runtime.digest  = sha256:… multi-arch index from runtime metadata
#   awf.core.console.digest   = sha256:… from awf-core-console.metadata.json
#
# Listing the pre-pushed multi-arch runtime tag under images: is forbidden:
# Cloud Build would pull/re-push and can collapse the manifest list.

steps:
  # Agent-runtime must publish linux/amd64 + linux/arm64 (DGX Spark / PRD §18.5).
  # Plain `docker build` only produces the builder's platform (amd64 on Cloud Build).
  - id: setup-qemu
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --privileged
      - --rm
      # Pin by digest: privileged helper must not float on :latest.
      - tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - --install
      - all

  - id: create-buildx-builder
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - create
      - --use
      - --name
      - awf-multiarch
      - --driver
      - docker-container

  - id: build-and-push-core
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - --file
      - docker/control-plane.Dockerfile
      - --tag
      - ${_ARTIFACT_REPOSITORY}/awf-core:rc-$COMMIT_SHA
      - --push
      - --metadata-file
      - /workspace/awf-core.metadata.json
      - .

  - id: build-and-push-agent-runtime
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - --platform
      - linux/amd64,linux/arm64
      - --file
      - docker/agent-runtime.Dockerfile
      - --tag
      - ${_ARTIFACT_REPOSITORY}/awf-agent-runtime:rc-$COMMIT_SHA
      - --push
      - --metadata-file
      - /workspace/awf-agent-runtime.metadata.json
      - .

  - id: build-and-push-core-console
    name: gcr.io/cloud-builders/docker
    args:
      - buildx
      - build
      - --file
      - apps/console/Dockerfile
      - --tag
      - ${_ARTIFACT_REPOSITORY}/awf-core-console:rc-$COMMIT_SHA
      - --build-arg
      - NEXT_PUBLIC_AWF_CONSOLE_BASE_PATH=/workspaces
      - --build-arg
      - NEXT_PUBLIC_AWF_CONSOLE_API_BASE=/api/core-console
      - --build-arg
      - NEXT_PUBLIC_AWF_CONSOLE_OPERATOR_BASE=/api/core-console
      - --build-arg
      - NEXT_PUBLIC_AWF_CONSOLE_CONTEXT_QUERY_KEYS=org_id,project_id
      - --push
      - --metadata-file
      - /workspace/awf-core-console.metadata.json
      - .

  # Digest-pinned Python helper validates bindings, writes a source-able env
  # file, and emits the carrier docker buildx --load script from
  # carrier_docker_build_argv (single source of truth for labels / builder).
  # Never prints credentials or tokens — only digests / SHA / build id / repo.
  - id: prepare-provenance-carrier
    name: python:3.12.13-slim@sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36
    entrypoint: python3
    args:
      - scripts/cloudbuild_provenance.py
      - prepare
      - --build-id
      - $BUILD_ID
      - --commit-sha
      - $COMMIT_SHA
      - --source-repository
      - $REPO_FULL_NAME
      - --artifact-repository
      - ${_ARTIFACT_REPOSITORY}
      - --core-metadata
      - /workspace/awf-core.metadata.json
      - --runtime-metadata
      - /workspace/awf-agent-runtime.metadata.json
      - --console-metadata
      - /workspace/awf-core-console.metadata.json
      - --output-env
      - /workspace/awf-provenance.env
      - --output-build-script
      - /workspace/awf-provenance-build.sh

  - id: build-provenance-carrier
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        # Carrier argv (Dockerfile, --builder default, --load, six labels) is
        # generated by prepare-provenance-carrier from carrier_docker_build_argv.
        bash /workspace/awf-provenance-build.sh

# Only the provenance carrier is listed here. Cloud Build pushes it after the
# steps and records the immutable digest in results.images (and can generate
# provenance). Core + multi-arch runtime + hosted console were already
# published via buildx --push above; re-listing them would risk collapsing the
# runtime manifest list.
images:
  - ${_ARTIFACT_REPOSITORY}/awf-core-provenance:build-$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
