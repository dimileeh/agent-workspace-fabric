# Pre-commit hooks for AWF — install locally with:
#   pre-commit install
# Run on all files:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: awf-ruff-check
        name: ruff check
        entry: uv run --python 3.12 --extra dev ruff check .
        language: system
        pass_filenames: false
      - id: awf-ruff-format-check
        name: ruff format --check
        entry: uv run --python 3.12 --extra dev ruff format --check .
        language: system
        pass_filenames: false
      - id: awf-mypy
        name: mypy
        entry: uv run --python 3.12 --extra dev mypy
        language: system
        pass_filenames: false
        files: ^(src|tests)/
