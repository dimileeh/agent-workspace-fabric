# Alembic config for AWF control plane.
# DB URL is read from AWF_DATABASE_URL at runtime (see migrations/env.py),
# so this file does not hardcode it.

[alembic]
script_location = migrations
prepend_sys_path = ./src
path_separator = os
version_path_separator = os
timezone = UTC

# Tell Alembic to use the async engine path defined in migrations/env.py.
# (env.py handles both online/offline modes.)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
