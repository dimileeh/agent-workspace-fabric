name: awf-local-service

x-awf-service: &awf-service
  build:
    context: ../..
    dockerfile: docker/control-plane.Dockerfile
  image: awf-control-plane:local
  working_dir: /app
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /run/host-services/ssh-auth.sock:/run/host-services/ssh-auth.sock
    - ${AWF_HOST_WORK_DIR:-${HOME}/.awf/service}:${AWF_HOST_WORK_DIR:-${HOME}/.awf/service}
    - ${AWF_HOST_HOME:-${HOME}}/.config/gh:${AWF_HOST_HOME:-${HOME}}/.config/gh:ro
    - ${AWF_HOST_HOME:-${HOME}}/.config/gcloud:${AWF_HOST_HOME:-${HOME}}/.config/gcloud:ro
    - ${AWF_HOST_HOME:-${HOME}}/.gitconfig:${AWF_HOST_HOME:-${HOME}}/.gitconfig:ro
    - ${AWF_HOST_HOME:-${HOME}}/.ssh:${AWF_HOST_HOME:-${HOME}}/.ssh:ro
    - ${AWF_HOST_HOME:-${HOME}}/.codex:${AWF_HOST_HOME:-${HOME}}/.codex:ro
    - ${AWF_HOST_HOME:-${HOME}}/.claude:${AWF_HOST_HOME:-${HOME}}/.claude:ro
    - ${AWF_HOST_HOME:-${HOME}}/.claude.json:${AWF_HOST_HOME:-${HOME}}/.claude.json:ro
    - ${AWF_HOST_HOME:-${HOME}}/.gemini:${AWF_HOST_HOME:-${HOME}}/.gemini:ro
  environment: &awf-environment
    AWF_SERVICE_NAME: awf
    AWF_ENV: local
    AWF_LOG_LEVEL: INFO
    AWF_API_HOST: 0.0.0.0
    AWF_API_PORT: "8000"
    AWF_API_BASE_URL: http://api:8000
    AWF_API_TOKEN: ${AWF_API_TOKEN:-local-dev-token}
    AWF_GITHUB_TOKEN: ${AWF_GITHUB_TOKEN:-}
    AWF_DATABASE_URL: postgresql+asyncpg://awf:awf_dev@postgres:5432/awf
    AWF_DOCKER_HOST: unix:///var/run/docker.sock
    AWF_AGENT_RUNTIME_IMAGE: awf-agent-runtime:latest
    AWF_WORK_DIR: ${AWF_HOST_WORK_DIR:-${HOME}/.awf/service}
    AWF_HOST_HOME: ${AWF_HOST_HOME:-${HOME}}
    GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    AWF_WORKER_POLL_INTERVAL_SECONDS: "1.0"
    AWF_WORKER_MAX_CONCURRENT_PROVISIONS: "3"
    AWF_WORKER_MAX_CONCURRENT_EXECUTIONS: "3"
    SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: awf
      POSTGRES_PASSWORD: awf_dev
      POSTGRES_DB: awf
    ports:
      - "5433:5432"
    volumes:
      - awf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awf -d awf"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    <<: *awf-service
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head"
    restart: "no"

  api:
    <<: *awf-service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: sh -c "awf serve --host 0.0.0.0 --port 8000"

  worker:
    <<: *awf-service
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: sh -c "awf worker"

volumes:
  awf-postgres-data:
