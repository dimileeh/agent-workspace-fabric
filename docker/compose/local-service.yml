name: awf-local-service

x-awf-auth-volumes:
  - &awf-gh-auth ${AWF_HOST_HOME:-${HOME}}/.config/gh:${AWF_HOST_HOME:-${HOME}}/.config/gh:ro
  - &awf-gcloud-auth ${AWF_HOST_HOME:-${HOME}}/.config/gcloud:${AWF_HOST_HOME:-${HOME}}/.config/gcloud:ro
  - &awf-gitconfig-auth ${AWF_HOST_HOME:-${HOME}}/.gitconfig:${AWF_HOST_HOME:-${HOME}}/.gitconfig:ro
  - &awf-ssh-auth ${AWF_HOST_HOME:-${HOME}}/.ssh:${AWF_HOST_HOME:-${HOME}}/.ssh:ro
  - &awf-codex-auth ${AWF_HOST_HOME:-${HOME}}/.codex:${AWF_HOST_HOME:-${HOME}}/.codex:ro
  - &awf-claude-dir-auth ${AWF_HOST_HOME:-${HOME}}/.claude:${AWF_HOST_HOME:-${HOME}}/.claude:ro
  - &awf-claude-file-auth ${AWF_HOST_HOME:-${HOME}}/.claude.json:${AWF_HOST_HOME:-${HOME}}/.claude.json:ro
  - &awf-gemini-auth ${AWF_HOST_HOME:-${HOME}}/.gemini:${AWF_HOST_HOME:-${HOME}}/.gemini:ro
  - &awf-opencode-auth ${AWF_HOST_HOME:-${HOME}}/.config/opencode:${AWF_HOST_HOME:-${HOME}}/.config/opencode:ro
  - &awf-grok-auth ${AWF_HOST_HOME:-${HOME}}/.grok:${AWF_HOST_HOME:-${HOME}}/.grok:ro
  - &awf-ollama-auth ${AWF_HOST_HOME:-${HOME}}/.ollama:${AWF_HOST_HOME:-${HOME}}/.ollama:ro

# api/worker/migrate run as root inside the container by design. The control
# plane needs root to use the host Docker socket, the forwarded SSH-agent
# socket, and to chown per-workspace worktrees to UID/GID 1000 so the
# agent-runtime container's `agent` user can run git commands in /workspace.
# See docs/AWF_LOCAL_CONTAINER_UID_STRATEGY.md.
x-awf-service: &awf-service
  build:
    context: ../..
    dockerfile: docker/control-plane.Dockerfile
  image: awf-control-plane:local
  working_dir: /app
  volumes:
    - &awf-docker-sock /var/run/docker.sock:/var/run/docker.sock
    - &awf-service-ssh-agent ${AWF_HOST_SSH_AUTH_SOCK:-${SSH_AUTH_SOCK:-/run/host-services/ssh-auth.sock}}:/run/host-services/ssh-auth.sock
    - &awf-host-work-dir ${AWF_HOST_WORK_DIR:-${HOME}/.awf/service}:${AWF_HOST_WORK_DIR:-${HOME}/.awf/service}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &awf-environment
    AWF_SERVICE_NAME: awf
    AWF_ENV: local
    AWF_LOG_LEVEL: INFO
    AWF_API_HOST: 0.0.0.0
    AWF_API_PORT: "8000"
    AWF_API_BASE_URL: http://api:8000
    AWF_API_TOKEN: ${AWF_API_TOKEN:-local-dev-token}
    AWF_GITHUB_TOKEN: ${AWF_GITHUB_TOKEN:-${GH_TOKEN:-${GITHUB_TOKEN:-}}}
    GH_TOKEN: ${AWF_GITHUB_TOKEN:-${GH_TOKEN:-${GITHUB_TOKEN:-}}}
    GITHUB_TOKEN: ${AWF_GITHUB_TOKEN:-${GH_TOKEN:-${GITHUB_TOKEN:-}}}
    AWF_DATABASE_URL: "postgresql+asyncpg://awf:${AWF_POSTGRES_PASSWORD:-awf_dev}@postgres:5432/awf"
    AWF_DOCKER_HOST: unix:///var/run/docker.sock
    AWF_AGENT_RUNTIME_IMAGE: ${AWF_AGENT_RUNTIME_IMAGE:-awf-agent-runtime:latest}
    AWF_COMPANION_IMAGE_CACHE_ENABLED: ${AWF_COMPANION_IMAGE_CACHE_ENABLED:-true}
    AWF_COMPANION_IMAGE_RETENTION_HOURS: ${AWF_COMPANION_IMAGE_RETENTION_HOURS:-168}
    AWF_WORK_DIR: ${AWF_HOST_WORK_DIR:-${HOME}/.awf/service}
    AWF_HOST_HOME: ${AWF_HOST_HOME:-${HOME}}
    # Set by the ``awf service bootstrap`` work-dir mount-propagation preflight
    # (src/awf/service/bootstrap.py) on hosts where a worker-mounted ``~/.claude``
    # overlay would never propagate into the agent container (Docker Desktop /
    # virtiofs / grpcfuse). When ``true`` the worker uses the per-workspace copy
    # fallback instead of provisioning an empty overlay. Defaults off.
    AWF_CLAUDE_AUTH_FORCE_COPY: ${AWF_CLAUDE_AUTH_FORCE_COPY:-false}
    GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
    ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    ANTHROPIC_SMALL_FAST_MODEL: ${ANTHROPIC_SMALL_FAST_MODEL:-}
    CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    CLAUDE_CODE_USE_BEDROCK: ${CLAUDE_CODE_USE_BEDROCK:-}
    CLAUDE_CODE_USE_VERTEX: ${CLAUDE_CODE_USE_VERTEX:-}
    CURSOR_API_KEY: ${CURSOR_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_API_KEY_AUTH_MECHANISM: ${GEMINI_API_KEY_AUTH_MECHANISM:-}
    GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
    GOOGLE_GENAI_USE_GCA: ${GOOGLE_GENAI_USE_GCA:-}
    GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
    GOOGLE_CLOUD_ACCESS_TOKEN: ${GOOGLE_CLOUD_ACCESS_TOKEN:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
    BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    XAI_API_KEY: ${XAI_API_KEY:-}
    CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
    AWF_OPENCODE_OLLAMA_BASE_URL: ${AWF_OPENCODE_OLLAMA_BASE_URL:-}
    OLLAMA_HOST: ${OLLAMA_HOST:-}
    OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS: ${OPENCODE_EXPERIMENTAL_BASH_DEFAULT_TIMEOUT_MS:-600000}
    AWF_WORKER_POLL_INTERVAL_SECONDS: "1.0"
    AWF_WORKER_MAX_CONCURRENT_PROVISIONS: ${AWF_WORKER_MAX_CONCURRENT_PROVISIONS:-3}
    AWF_WORKER_MAX_CONCURRENT_EXECUTIONS: ${AWF_WORKER_MAX_CONCURRENT_EXECUTIONS:-3}
    AWF_WORKER_NODE_ID: local
    AWF_AGENT_WALL_TIMEOUT_SECONDS: ${AWF_AGENT_WALL_TIMEOUT_SECONDS:-7200}
    AWF_AGENT_IDLE_TIMEOUT_SECONDS: ${AWF_AGENT_IDLE_TIMEOUT_SECONDS:-3600}
    AWF_PLANNING_MAX_ITERATIONS_DEFAULT: ${AWF_PLANNING_MAX_ITERATIONS_DEFAULT:-3}
    AWF_COMPLETED_WORKSPACE_RETENTION_HOURS: ${AWF_COMPLETED_WORKSPACE_RETENTION_HOURS:-168}
    AWF_WORKSPACE_CLEANUP_ENABLED: ${AWF_WORKSPACE_CLEANUP_ENABLED:-true}
    AWF_WORKSPACE_CLEANUP_SCAN_INTERVAL_SECONDS: ${AWF_WORKSPACE_CLEANUP_SCAN_INTERVAL_SECONDS:-3600}
    AWF_WORKSPACE_CLEANUP_BATCH_LIMIT: ${AWF_WORKSPACE_CLEANUP_BATCH_LIMIT:-50}
    AWF_AUTO_CLEANUP_ORPHANS: ${AWF_AUTO_CLEANUP_ORPHANS:-false}
    AWF_ORPHAN_RECONCILE_SCAN_INTERVAL_SECONDS: ${AWF_ORPHAN_RECONCILE_SCAN_INTERVAL_SECONDS:-3600}
    AWF_CLASSIFIED_ORPHAN_REAP_SCAN_INTERVAL_SECONDS: ${AWF_CLASSIFIED_ORPHAN_REAP_SCAN_INTERVAL_SECONDS:-3600}
    AWF_ORPHAN_RECONCILE_MAX_PER_SCAN: ${AWF_ORPHAN_RECONCILE_MAX_PER_SCAN:-50}
    AWF_ORPHAN_RECONCILE_MIN_AGE_HOURS: ${AWF_ORPHAN_RECONCILE_MIN_AGE_HOURS:-168}
    AWF_NETWORK_POSTURE_OPEN_LEGACY_CUTOFF: ${AWF_NETWORK_POSTURE_OPEN_LEGACY_CUTOFF:-}
    AWF_WORKSPACE_STEADY_CPU: ${AWF_WORKSPACE_STEADY_CPU:-3}
    AWF_WORKSPACE_STEADY_MEMORY_GB: ${AWF_WORKSPACE_STEADY_MEMORY_GB:-10}
    AWF_WORKSPACE_PEAK_CPU: ${AWF_WORKSPACE_PEAK_CPU:-6}
    AWF_WORKSPACE_PEAK_MEMORY_GB: ${AWF_WORKSPACE_PEAK_MEMORY_GB:-16}
    AWF_LOCAL_CAPACITY_CPU_CORES: ${AWF_LOCAL_CAPACITY_CPU_CORES:-}
    AWF_LOCAL_CAPACITY_MEMORY_GB: ${AWF_LOCAL_CAPACITY_MEMORY_GB:-}
    AWF_LOCAL_CAPACITY_DIND_SLOTS: ${AWF_LOCAL_CAPACITY_DIND_SLOTS:-}
    SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock

services:
  agent-runtime:
    build:
      context: ../..
      dockerfile: docker/agent-runtime.Dockerfile
    image: ${AWF_AGENT_RUNTIME_IMAGE:-awf-agent-runtime:latest}
    command: sh -c "true"
    restart: "no"

  postgres:
    image: postgres:16-alpine
    shm_size: ${AWF_POSTGRES_SHM_SIZE:-1g}
    environment:
      POSTGRES_USER: awf
      POSTGRES_PASSWORD: "${AWF_POSTGRES_PASSWORD:-awf_dev}"
      POSTGRES_DB: awf
    ports:
      - "127.0.0.1:${AWF_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - awf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awf -d awf"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    <<: *awf-service
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head"
    restart: "no"

  api:
    <<: *awf-service
    depends_on:
      agent-runtime:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - *awf-docker-sock
      - *awf-service-ssh-agent
      - *awf-host-work-dir
      - *awf-gh-auth
      - *awf-gcloud-auth
      - *awf-gitconfig-auth
      - *awf-ssh-auth
      - *awf-codex-auth
      - *awf-claude-dir-auth
      - *awf-claude-file-auth
      - *awf-gemini-auth
      - *awf-opencode-auth
      - *awf-grok-auth
      - *awf-ollama-auth
    ports:
      - "127.0.0.1:${AWF_API_HOST_PORT:-8000}:8000"
    command: sh -c "awf serve --host 0.0.0.0 --port 8000"

  worker:
    <<: *awf-service
    depends_on:
      agent-runtime:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The worker provisions workspaces and mounts a shared-base + per-workspace
    # overlay for ~/.claude (see src/awf/node/auth_mounts.py). SYS_ADMIN lets the
    # root worker call mount(2)/umount(2); without it the overlay path falls back
    # to the legacy full copy (correct, but no disk saving). This is a deliberate
    # least-privilege downgrade scoped to the worker — provider readiness reports
    # the resulting isolation posture (per_workspace_overlay vs per_workspace_copy).
    cap_add:
      - SYS_ADMIN
    volumes:
      - *awf-docker-sock
      - *awf-service-ssh-agent
      # ``:rshared`` so an overlay the worker mounts under the work dir is visible
      # to the sibling agent container the host daemon launches; the default
      # ``rprivate`` would leave the agent's bind of the merged view empty. The
      # host-side work dir must itself be a shared mount. The ``awf service
      # bootstrap`` work-dir mount-propagation preflight gates this flag: it sets
      # ``AWF_WORK_DIR_BIND_PROPAGATION=rprivate`` (and forces the copy fallback
      # via ``AWF_CLAUDE_AUTH_FORCE_COPY``) on hosts whose work dir cannot be made
      # an ``rshared`` mount, so the worker neither fails to start nor silently
      # provisions an empty ``~/.claude``. Defaults to ``rshared``.
      - ${AWF_HOST_WORK_DIR:-${HOME}/.awf/service}:${AWF_HOST_WORK_DIR:-${HOME}/.awf/service}:${AWF_WORK_DIR_BIND_PROPAGATION:-rshared}
      - *awf-gh-auth
      - *awf-gcloud-auth
      - *awf-gitconfig-auth
      - *awf-ssh-auth
      - *awf-codex-auth
      - *awf-claude-dir-auth
      - *awf-claude-file-auth
      - *awf-gemini-auth
      - *awf-opencode-auth
      - *awf-grok-auth
      - *awf-ollama-auth
    command: sh -c "awf worker"

  console:
    build:
      context: ../..
      dockerfile: apps/console/Dockerfile
    image: awf-console:local
    depends_on:
      api:
        condition: service_started
    environment:
      AWF_API_BASE_URL: http://api:8000
      AWF_API_TOKEN: ${AWF_API_TOKEN:-local-dev-token}
      NEXT_PUBLIC_AWF_CONSOLE_POLL_MS: ${NEXT_PUBLIC_AWF_CONSOLE_POLL_MS:-5000}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${AWF_CONSOLE_HOST_PORT:-3000}:3000"

  ollama-bridge:
    profiles:
      - ollama-bridge
    image: alpine/socat:1.8.0.3
    network_mode: host
    command:
      - "TCP-LISTEN:${AWF_OLLAMA_BRIDGE_LISTEN_PORT:-11434},bind=${AWF_OLLAMA_BRIDGE_BIND_ADDRESS:-172.17.0.1},fork,reuseaddr"
      - "TCP:${AWF_OLLAMA_BRIDGE_TARGET_HOST:-127.0.0.1}:${AWF_OLLAMA_BRIDGE_TARGET_PORT:-11434}"
    restart: unless-stopped

volumes:
  awf-postgres-data:
