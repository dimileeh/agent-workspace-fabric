[project]
name = "awf-core-demo"
version = "0.1.0"
description = "Small DB-backed demo project used by the AWF Core release gate."
requires-python = ">=3.12"
dependencies = [
  "psycopg>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
