[project]
name = "agent-workspace-fabric"
version = "0.1.0"
description = "Agent Workspace Fabric — isolated Docker execution substrate for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dmitri Lihhatsov", email = "dmitri@aira.pro" },
]
keywords = ["ai", "agents", "orchestration", "docker", "infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "typer>=0.26.7",
    "jinja2>=3.1.0",
    "keyring>=24",
    "docker>=7.0.0",
    "mcp>=1.9.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3.0",
    "pytest-mock>=3.14.0",
    "pytest-split>=0.10.0",
    "pytest-xdist>=3.6.0",
    "testcontainers[postgres]>=4.8.0",
    "hypothesis>=6.112.0",
    "openapi-spec-validator>=0.7.0",
    "types-PyYAML>=6.0.0",
    "ruff>=0.15.16",
    "mypy>=2.1.0",
    "types-jinja2>=2.11.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
awf = "awf.cli.main:app"

[project.urls]
Repository = "https://github.com/dimileeh/agent-workspace-fabric"
Issues = "https://github.com/dimileeh/agent-workspace-fabric/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awf"]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "docker/compose/.env",
]

[tool.hatch.build.targets.wheel.force-include]
".env.example" = "awf/bootstrap_assets/.env.example"
"compose.yaml" = "awf/bootstrap_assets/compose.yaml"
"README.md" = "awf/bootstrap_assets/README.md"
"alembic.ini" = "awf/bootstrap_assets/alembic.ini"
"apps/console/Dockerfile" = "awf/bootstrap_assets/apps/console/Dockerfile"
"apps/console/app" = "awf/bootstrap_assets/apps/console/app"
"apps/console/components" = "awf/bootstrap_assets/apps/console/components"
"apps/console/lib" = "awf/bootstrap_assets/apps/console/lib"
"apps/console/next.config.ts" = "awf/bootstrap_assets/apps/console/next.config.ts"
"apps/console/package-lock.json" = "awf/bootstrap_assets/apps/console/package-lock.json"
"apps/console/package.json" = "awf/bootstrap_assets/apps/console/package.json"
"apps/console/postcss.config.mjs" = "awf/bootstrap_assets/apps/console/postcss.config.mjs"
"apps/console/scripts" = "awf/bootstrap_assets/apps/console/scripts"
"apps/console/tsconfig.json" = "awf/bootstrap_assets/apps/console/tsconfig.json"
"docs" = "awf/bootstrap_assets/docs"
"docker/agent-runtime.Dockerfile" = "awf/bootstrap_assets/docker/agent-runtime.Dockerfile"
"docker/compose/local-service.yml" = "awf/bootstrap_assets/docker/compose/local-service.yml"
"docker/compose/workspace.base.yml.j2" = "awf/bootstrap_assets/docker/compose/workspace.base.yml.j2"
"docker/control-plane.Dockerfile" = "awf/bootstrap_assets/docker/control-plane.Dockerfile"
"migrations" = "awf/bootstrap_assets/migrations"
"openapi.json" = "awf/bootstrap_assets/openapi.json"
"pyproject.toml" = "awf/bootstrap_assets/pyproject.toml"
"src" = "awf/bootstrap_assets/src"
"uv.lock" = "awf/bootstrap_assets/uv.lock"

[tool.hatch.build.targets.sdist]
include = [
    "/.env.example",
    "/compose.yaml",
    "/README.md",
    "/RELEASING.md",
    "/alembic.ini",
    "/apps/console/Dockerfile",
    "/apps/console/app",
    "/apps/console/components",
    "/apps/console/lib",
    "/apps/console/next.config.ts",
    "/apps/console/package-lock.json",
    "/apps/console/package.json",
    "/apps/console/postcss.config.mjs",
    "/apps/console/scripts",
    "/apps/console/tsconfig.json",
    "/docs",
    "/docker/agent-runtime.Dockerfile",
    "/docker/compose/local-service.yml",
    "/docker/compose/workspace.base.yml.j2",
    "/docker/control-plane.Dockerfile",
    "/migrations",
    "/openapi.json",
    "/packaging/install.sh",
    "/pyproject.toml",
    "/scripts/generate_install_manifest.py",
    "/src",
    "/uv.lock",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "/apps/console/.env.local",
    "/apps/console/.next",
    "/apps/console/next-env.d.ts",
    "/apps/console/node_modules",
    "/apps/console/playwright-report",
    "/apps/console/test-results",
    "/apps/console/tsconfig.tsbuildinfo",
    "/docker/compose/.env",
]

[tool.hatch.build.targets.sdist.force-include]
# Keep this alongside the sdist include entry: hatchling's wheel-from-sdist
# path can otherwise omit this console source directory from generated wheels.
"apps/console/lib" = "apps/console/lib"

[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true
extend-exclude = [
    ".venv",
    "migrations/versions",
    "build",
    "dist",
    "docker/compose/local-service.yml",
]

[tool.ruff.lint]
# ERA (eradicate) is intentionally left out — it false-positives on docstrings
# and URL-containing Field(description=...) arguments.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line-too-long handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]  # test fixtures often appear unused to ruff
"migrations/**" = ["E402", "F401"]
# Generator scripts are small build/docs tools. Keep their lint posture slightly
# looser so CLI helper signatures can stay simple.
"scripts/**" = [
    "ARG001",
    "ARG002",
    "SIM105",  # try/except/pass preferred over contextlib.suppress for short guards
    "SIM110",  # explicit for-loop preferred over any()/all() in CLI helpers
    "B007",
    "B023",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and Typer require these calls as argument defaults; the rule's warning
# ("don't call functions in defaults") doesn't apply to DI markers that aren't
# evaluated eagerly.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "pydantic.Field",
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
# Only type-check production code. Tests use dynamic fixtures, stub
# injection, and deliberately incomplete annotations (the pattern
# ``def test_x(foo):`` is ubiquitous and useful); scripts are operator
# CLIs that trade type-strictness for readability at the
# subprocess/argparse boundary. Restricting ``files`` here makes the
# bare ``mypy`` invocation in CI walk only ``src/``.
files = ["src/"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 30
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "unit: pure unit tests with no external dependencies",
    "integration: tests exercising real database or container boundaries",
    "e2e: end-to-end tests against a live AWF service",
    "docker: tests requiring a live Docker daemon",
    "slow: tests that take longer than 1 second",
]

[tool.coverage.run]
source = ["src/awf"]
branch = true
omit = [
    "src/awf/__main__.py",
    "src/awf/cli/main.py",  # Typer CLI tested via integration/e2e
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    # Protocol / abstract method stub bodies written as a bare ``...``. These are
    # type declarations with no runtime behaviour (the concrete implementation
    # overrides them), so they are verified by mypy's structural-conformance
    # checks, not by pytest. Excluding them avoids writing throwaway tests that
    # call the stub solely to mark the line executed. Matches a line that is
    # only ``...`` (never ``x = ...`` or ``foo[...]``).
    '^\s*\.\.\.\s*$',
]
fail_under = 99
show_missing = true
skip_covered = false
