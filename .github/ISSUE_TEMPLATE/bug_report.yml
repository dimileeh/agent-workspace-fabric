name: Bug report
description: Report a reproducible AWF Core defect.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, workspace ids, logs, and profile snippets with secrets redacted.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AWF version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Local environment
      description: OS, Docker version, provider/runtime, and whether BYOK credentials were used.
    validations:
      required: true
