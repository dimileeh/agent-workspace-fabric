name: Publish Python Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Trusted Publishing target. Use testpypi before pypi."
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "testpypi"
          - "pypi"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.31"
          github-token: ""

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel and sdist
        run: |
          uv venv --python 3.12
          uv pip install build
          .venv/bin/python -m build
          mkdir -p artifacts/release
          sha256sum dist/* | tee artifacts/release/python-distribution-sha256.txt
          VERSION="$(
            .venv/bin/python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as project_file:
              print(tomllib.load(project_file)["project"]["version"])
          PY
          )"
          TAG="${GITHUB_REF_NAME:-v${VERSION}}"
          if [[ "${TAG}" != v* ]]; then
            TAG="v${VERSION}"
          fi
          .venv/bin/python scripts/generate_install_manifest.py \
            --dist-dir dist \
            --checksums-file artifacts/release/python-distribution-sha256.txt \
            --output artifacts/release/awf-install-manifest.json \
            --version "${VERSION}" \
            --tag "${TAG}" \
            --repository-url "https://github.com/dimileeh/aira-agent-workspace-fabric" \
            --channel auto

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

      - name: Upload release audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution-checksums
          path: |
            artifacts/release/python-distribution-sha256.txt
            artifacts/release/awf-install-manifest.json
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_target != 'none' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.publish_target }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish via PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.publish_target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
