name: CI

on:
  # CI runs only on pull requests (open / new commit / reopen), any base branch.
  # Pushes to main/development are not re-tested: every change lands via a PR,
  # so the pull_request run is the authoritative gate and a push run would just
  # re-test an already-validated merge commit.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default GITHUB_TOKEN scope for every job. No ci.yml job pushes
# packages/images (image builds use ``push: false``), creates releases, comments
# on PRs, or writes statuses; ``actions/upload-artifact`` uses the per-run Actions
# artifact service (not the ``contents`` scope). So read-only contents — the
# minimum for ``actions/checkout`` — is sufficient and strictly least-privilege.
# Resolves CodeQL ``actions/missing-workflow-permissions``.
permissions:
  contents: read

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.5.31"
          github-token: ""

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Check Jinja2 template escaping
        run: .venv/bin/python scripts/ci/check_j2_tojson.py

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Format check (ruff)
        run: .venv/bin/ruff format --check .

      - name: Type check (mypy)
        # No path args — relies on ``files = ["src/"]`` in pyproject.toml.
        # Tests use dynamic fixtures + stub injection; running ``--strict``
        # against them generates noise without catching real bugs.
        run: .venv/bin/mypy

  python-coverage-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: awf
          POSTGRES_PASSWORD: awf_ci
          POSTGRES_DB: awf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U awf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.5.31"
          github-token: ""

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "uv sync attempt ${attempt}/3"
            if uv sync --python 3.12 --extra dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed; retrying in 10s"
              sleep 10
            fi
          done
          echo "uv sync failed after 3 attempts"
          exit 1

      - name: Verify Docker and Compose
        run: |
          docker version
          docker compose version

      - name: Run coverage shard
        env:
          CI: "true"
          AWF_DATABASE_URL: postgresql+asyncpg://awf:awf_ci@localhost:5432/awf
          AWF_TEST_DATABASE_URL: postgresql+asyncpg://awf:awf_ci@localhost:5432/awf
        run: |
          set -euo pipefail
          shopt -s nullglob
          uv run --python 3.12 coverage erase
          uv run --python 3.12 coverage run --parallel-mode -m pytest \
            --splits 8 \
            --group "${{ matrix.shard }}" \
            --timeout=300
          mkdir -p coverage-artifacts
          coverage_files=(.coverage.*)
          if [ "${#coverage_files[@]}" -ne 1 ]; then
            echo "Expected exactly one coverage data file, found ${#coverage_files[@]}."
            printf '%s\n' "${coverage_files[@]}"
            exit 1
          fi
          mv "${coverage_files[0]}" "coverage-artifacts/.coverage.shard-${{ matrix.shard }}"

      - name: Upload coverage shard
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: python-coverage-shard-${{ matrix.shard }}
          path: coverage-artifacts/.coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 14

  python-full-coverage:
    runs-on: ubuntu-latest
    needs: python-coverage-shards
    if: ${{ always() }}
    timeout-minutes: 15
    steps:
      - name: Verify coverage shards passed
        if: ${{ needs.python-coverage-shards.result != 'success' }}
        run: |
          echo "python-coverage-shards result: ${{ needs.python-coverage-shards.result }}"
          exit 1

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.5.31"
          github-token: ""

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "uv sync attempt ${attempt}/3"
            if uv sync --python 3.12 --extra dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed; retrying in 10s"
              sleep 10
            fi
          done
          echo "uv sync failed after 3 attempts"
          exit 1

      - name: Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: python-coverage-shard-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Combine coverage and enforce threshold
        run: |
          set -euo pipefail
          shopt -s nullglob
          find coverage-artifacts -type f -name '.coverage.*' -print
          coverage_files=(coverage-artifacts/.coverage.*)
          if [ "${#coverage_files[@]}" -eq 0 ]; then
            echo "No coverage shard artifacts were downloaded."
            exit 1
          fi
          cp "${coverage_files[@]}" .
          uv run --python 3.12 coverage combine
          uv run --python 3.12 coverage xml
          uv run --python 3.12 coverage report --show-missing --fail-under=99
          uv run --python 3.12 python scripts/ci/check_coverage_threshold.py coverage.xml --minimum-percent 99

      - name: Upload full coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: full-coverage-report
          path: coverage.xml
          retention-days: 14

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Install console dependencies
        run: npm --prefix apps/console ci

      - name: Lint console
        run: npm --prefix apps/console run lint

      - name: Type check console
        run: npm --prefix apps/console run typecheck

      - name: Build console
        run: npm --prefix apps/console run build

      - name: Install Playwright browser
        run: npm --prefix apps/console exec playwright install --with-deps chromium

      - name: Browser smoke
        run: npm --prefix apps/console run test:browser

  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.5.31"
          github-token: ""

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel and sdist
        run: |
          uv venv --python 3.12
          uv pip install build
          .venv/bin/python -m build

      - name: Install wheel and verify entrypoints
        run: |
          uv venv --python 3.12 /tmp/awf-wheel-smoke
          cd /tmp
          uv pip install --python /tmp/awf-wheel-smoke/bin/python "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/awf-wheel-smoke/bin/awf --help
          /tmp/awf-wheel-smoke/bin/awf init --help
          /tmp/awf-wheel-smoke/bin/awf service bootstrap --help
          /tmp/awf-wheel-smoke/bin/python - <<'PY'
          from pathlib import Path

          from awf.service.bootstrap import get_bootstrap_asset_root

          root = get_bootstrap_asset_root()
          assert root is not None, "packaged bootstrap asset root was not resolved"
          required = (
              "docker/agent-runtime.Dockerfile",
              "docker/control-plane.Dockerfile",
              "docker/compose/local-service.yml",
              "docker/compose/workspace.base.yml.j2",
              ".env.example",
              "openapi.json",
              "pyproject.toml",
              "src/awf/__init__.py",
              "migrations/env.py",
          )
          missing = [relative for relative in required if not (Path(root) / relative).is_file()]
          assert not missing, f"missing packaged bootstrap assets: {missing}"
          assert not (Path(root) / "docker/compose/.env").exists()
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4

      - name: Validate control-plane image build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          file: docker/control-plane.Dockerfile
          platforms: linux/amd64
          push: false

      - name: Validate agent-runtime image build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          file: docker/agent-runtime.Dockerfile
          platforms: linux/amd64
          push: false

  ci-required:
    runs-on: ubuntu-latest
    needs:
      - lint-and-type
      - python-full-coverage
      - console
      - release-artifacts
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Verify required jobs passed
        env:
          LINT_AND_TYPE_RESULT: ${{ needs['lint-and-type'].result }}
          PYTHON_FULL_COVERAGE_RESULT: ${{ needs['python-full-coverage'].result }}
          CONSOLE_RESULT: ${{ needs.console.result }}
          RELEASE_ARTIFACTS_RESULT: ${{ needs['release-artifacts'].result }}
        run: |
          for result in \
            "$LINT_AND_TYPE_RESULT" \
            "$PYTHON_FULL_COVERAGE_RESULT" \
            "$CONSOLE_RESULT" \
            "$RELEASE_ARTIFACTS_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "A required CI job did not pass."
              echo "lint-and-type: $LINT_AND_TYPE_RESULT"
              echo "python-full-coverage: $PYTHON_FULL_COVERAGE_RESULT"
              echo "console: $CONSOLE_RESULT"
              echo "release-artifacts: $RELEASE_ARTIFACTS_RESULT"
              exit 1
            fi
          done
