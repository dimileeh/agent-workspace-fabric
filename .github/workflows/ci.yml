name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Format check (ruff)
        run: .venv/bin/ruff format --check .

      - name: Type check (mypy)
        # No path args — relies on ``files = ["src/"]`` in pyproject.toml.
        # Tests use dynamic fixtures + stub injection; running ``--strict``
        # against them generates noise without catching real bugs.
        run: .venv/bin/mypy

      - name: Unit tests with coverage
        run: .venv/bin/pytest tests/unit/ -v --cov=awf --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # Integration tests run separately because they need Postgres + Docker.
  # Gated on lint-and-test passing so we don't burn runner minutes on broken code.
  integration:
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: awf
          POSTGRES_PASSWORD: awf_ci
          POSTGRES_DB: awf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U awf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Integration tests
        env:
          AWF_DATABASE_URL: postgresql+asyncpg://awf:awf_ci@localhost:5432/awf
        run: .venv/bin/pytest tests/integration/ -v
