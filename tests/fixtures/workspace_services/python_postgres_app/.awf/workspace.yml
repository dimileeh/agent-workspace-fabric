name: python-postgres-app
version: 1
description: Generic Python app profile with a workspace-local Postgres sidecar.
runtime:
  environment:
    APP_BASE_URL: http://app:8080
    DATABASE_URL: postgresql://awf:${AWF_POSTGRES_PASSWORD}@postgres:5432/awf
docker:
  mode: none
services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: awf
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_PASSWORD: ${AWF_POSTGRES_PASSWORD}
      POSTGRES_USER: awf
    healthcheck_cmd: pg_isready -U awf -d awf
    volumes:
      - [postgres_data, /var/lib/postgresql/data]
  - name: app
    build_context: .
    dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://awf:${AWF_POSTGRES_PASSWORD}@postgres:5432/awf
      PORT: "8080"
    depends_on:
      - postgres
    healthcheck_cmd: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()"
    command: python /app/app.py
phases:
  setup:
    - command: >-
        python -c "import os, urllib.request; body=urllib.request.urlopen(os.environ['APP_BASE_URL'] + '/setup', timeout=10).read().decode(); assert body == 'setup ok\n', body; print(body, end='')"
      timeout_seconds: 30
  validate:
    - command: >-
        python -c "import os, urllib.request; body=urllib.request.urlopen(os.environ['APP_BASE_URL'] + '/validate', timeout=10).read().decode(); assert body == 'validated awf-db-profile-fixture\n', body; print(body, end='')"
      timeout_seconds: 30
database:
  generated_setup:
    - command: >-
        python -c "import os, urllib.request; assert os.environ['DATABASE_URL'].startswith('postgresql://awf:'); body=urllib.request.urlopen(os.environ['APP_BASE_URL'] + '/setup', timeout=10).read().decode(); assert body == 'setup ok\n', body; print('generated setup ok')"
      timeout_seconds: 30
  pre_validation_refresh:
    - command: >-
        python -c "import os, urllib.request; assert os.environ['DATABASE_URL'].startswith('postgresql://awf:'); body=urllib.request.urlopen(os.environ['APP_BASE_URL'] + '/setup', timeout=10).read().decode(); assert body == 'setup ok\n', body; print('refresh ok')"
      timeout_seconds: 30
validation:
  healthchecks:
    - name: app
      command: >-
        python -c "import os, urllib.request; body=urllib.request.urlopen(os.environ['APP_BASE_URL'] + '/healthz', timeout=10).read().decode(); assert body == 'ok\n', body; print(body, end='')"
      timeout_seconds: 30
ports:
  app: http://app:8080
  postgres: postgresql://awf:${AWF_POSTGRES_PASSWORD}@postgres:5432/awf
